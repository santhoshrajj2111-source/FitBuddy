{% extends "base.html" %}

{% block title %}
FitBuddy | Error
{% endblock %}

{% block content %}

<section class="card error-card">

  <p class="eyebrow">
    SOMETHING WENT WRONG
  </p>

  <h1>
    Request could not be completed
  </h1>

  <p>
    {{ message }}
  </p>

  <a
    class="button secondary"
    href="/"
  >
    Back to FitBuddy
  </a>

</section>

{% endblock %}
